  heading2: {style: Heading 2, east_asia: 黑体, latin: Times New Roman, size_pt: 14, bold: true, align: left, pattern: "^\\d+\\.\\d+\\s"}
  caption:  {style: Caption,   east_asia: 宋体, latin: Times New Roman, size_pt: 10.5, align: center, pattern: "^[图表]\\d+[-.]\\d+"}
header: {text: "示例大学硕士学位论文", east_asia: 宋体, size_pt: 10.5, align: center}
drift:
  allowed_direct: [bold, italic, superscript, subscript]
