profile: example-master
source: "示例规则：数值参照国内高校研究生学位论文撰写规范的常见要求，非任何学校官方规则"
page: {margin_cm: {top: 2.5, bottom: 2.5, left: 3.0, right: 2.5}}
styles:
  body:     {style: Normal,    east_asia: 宋体, latin: Times New Roman, size_pt: 12, line_exact_pt: 20, first_line_indent_pt: 24, align: justify}
