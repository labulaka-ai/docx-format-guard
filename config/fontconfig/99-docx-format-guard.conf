<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  docx-format-guard 测试环境字体替代映射（见 docs/test-environment.md）。

  学校模板里写死的字体名（宋体/黑体/仿宋/Times New Roman/Arial/Calibri/Cambria）
  多为专有字体，Linux 上无官方免费分发。本映射把它们钉到度量最接近的开源字体：
    宋体/SimSun/仿宋/FangSong -> Noto Serif CJK SC（衬线）
    黑体/SimHei               -> Noto Sans CJK SC（黑体类无衬线）
    Times New Roman           -> Liberation Serif（与 TNR 度量等价，发行版默认已映射，此处显式钉死）
    Arial                     -> Liberation Sans（同上）
    Calibri                   -> Carlito（度量等价，fonts-crosextra-carlito）
    Cambria                   -> Caladea（度量等价，fonts-crosextra-caladea）

  注意：CJK 替代字体的行高与真字体仍有系统偏差，分页严格型断言（封面单页、
  逐页摘要等 4 项）在此环境下仍会失败，属已归因的“缺专有字体”，不是本映射能消除的。
  由 scripts/setup-test-env.sh 安装到 ~/.config/fontconfig/conf.d/。
-->
<fontconfig>
  <match target="pattern"><test name="family"><string>SimSun</string></test><edit name="family" mode="assign" binding="strong"><string>Noto Serif CJK SC</string></edit></match>
  <match target="pattern"><test name="family"><string>宋体</string></test><edit name="family" mode="assign" binding="strong"><string>Noto Serif CJK SC</string></edit></match>
  <match target="pattern"><test name="family"><string>NSimSun</string></test><edit name="family" mode="assign" binding="strong"><string>Noto Serif CJK SC</string></edit></match>
  <match target="pattern"><test name="family"><string>FangSong</string></test><edit name="family" mode="assign" binding="strong"><string>Noto Serif CJK SC</string></edit></match>
  <match target="pattern"><test name="family"><string>仿宋</string></test><edit name="family" mode="assign" binding="strong"><string>Noto Serif CJK SC</string></edit></match>
  <match target="pattern"><test name="family"><string>仿宋_GB2312</string></test><edit name="family" mode="assign" binding="strong"><string>Noto Serif CJK SC</string></edit></match>
  <match target="pattern"><test name="family"><string>KaiTi</string></test><edit name="family" mode="assign" binding="strong"><string>Noto Serif CJK SC</string></edit></match>
  <match target="pattern"><test name="family"><string>楷体</string></test><edit name="family" mode="assign" binding="strong"><string>Noto Serif CJK SC</string></edit></match>
  <match target="pattern"><test name="family"><string>SimHei</string></test><edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit></match>
  <match target="pattern"><test name="family"><string>黑体</string></test><edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit></match>
  <match target="pattern"><test name="family"><string>Times New Roman</string></test><edit name="family" mode="assign" binding="strong"><string>Liberation Serif</string></edit></match>
  <match target="pattern"><test name="family"><string>Arial</string></test><edit name="family" mode="assign" binding="strong"><string>Liberation Sans</string></edit></match>
  <match target="pattern"><test name="family"><string>Calibri</string></test><edit name="family" mode="assign" binding="strong"><string>Carlito</string></edit></match>
  <match target="pattern"><test name="family"><string>Cambria</string></test><edit name="family" mode="assign" binding="strong"><string>Caladea</string></edit></match>
</fontconfig>
